# SonarCloud configuration for Stratux
# Token should be provided via SONAR_TOKEN environment variable

sonar.projectKey=montge_stratux
sonar.organization=montge
sonar.projectName=stratux

# Source configuration
sonar.sources=.

# Exclusions:
# - Test files: *_test.go
# - Vendor/dependencies: vendor/
# - Test data: testdata/
# - Third-party code: dump978/, web/maui/, test/metar-to-text/, rtl-ais/, ogn/
# - Generated/build artifacts: image_build/pi-gen/
# - HTML files (use separate web analysis): *.html
# - Svelte web interface (separate frontend, has own build/test pipeline)
sonar.exclusions=**/*_test.go,\
  **/vendor/**,\
  **/testdata/**,\
  **/*.html,\
  dump978/**,\
  web/maui/**,\
  web-svelte/**,\
  test/metar-to-text/**,\
  rtl-ais/**,\
  ogn/**,\
  image_build/pi-gen/**,\
  dump1090/**

# Go coverage report
sonar.go.coverage.reportPaths=coverage.out

# Source encoding
sonar.sourceEncoding=UTF-8

# SonarCloud host
sonar.host.url=https://sonarcloud.io

# Disable C/C++/Objective-C analysis (code is in submodules without compilation database)
sonar.c.file.suffixes=-
sonar.cpp.file.suffixes=-
sonar.objc.file.suffixes=-
