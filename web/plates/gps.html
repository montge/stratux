<div class="col-sm-12" ng-cloak>
	<div class="col-sm-6">
		<div class="panel panel-default">
			<div class="panel-heading">
				<span ng-click="hideClick()" ng-keydown="$event.keyCode === 13 && hideClick()" tabindex="0" role="button" class="panel_label">AHRS</span>
				<span ng-show="ConnectState == 'Connected'" class="label label-success" ng-bind="ConnectState"></span>
				<span ng-hide="ConnectState == 'Connected'" class="label label-danger" ng-bind="ConnectState"></span>
			</div>
			<div class="panel-body">
				<div class="row">
					<span class="col-xs-12">
						<div id="ahrs_display"></div>
					</span>
				</div>
				<div class="col-xs-12">
					<div class="row" style="margin-bottom: 4px;">
						<div class="col-xs-3 text-center indicator off" id="status-calibrating">Ready</div>
						<div class="col-xs-3 text-center indicator off" id="status-gps">GPS</div>
						<div class="col-xs-3 text-center indicator off" id="status-imu">ATT</div>
						<div class="col-xs-3 text-center indicator off" id="status-bmp">ALT</div>
					</div>
				</div>
				<div class="col-xs-12">
					<div class="separator"></div>
					<div class="col-xs-3">
						<button class="btn btn-primary btn-block" ng-click="AHRSCage()"
								ng-disabled="IsCaging || !IMU_Sensor_Enabled">Set Level</button>
						<button class="btn btn-primary btn-block" ng-click="AHRSCalibrate()"
								ng-disabled="IsCaging || !IMU_Sensor_Enabled">Zero Drift</button>
					</div>
					<div class="col-xs-9">
						<div class="row">
							<strong class="col-xs-3 text-center">Heading</strong>
							<strong class="col-xs-3 text-center">Pitch</strong>
							<strong class="col-xs-3 text-center">Roll</strong>
							<strong class="col-xs-3 text-center">P-Alt</strong>
						</div>
						<div class="row">
							<span class="col-xs-3 text-center"><span ng-bind="ahrs_heading"></span>&deg;</span>
							<span class="col-xs-3 text-center"><span ng-bind="ahrs_pitch"></span>&deg;</span>
							<span class="col-xs-3 text-center"><span ng-bind="ahrs_roll"></span>&deg;</span>
							<span class="col-xs-3 text-center"><span ng-bind="ahrs_alt"></span>'</span>
						</div>
						<div class="row">
							<strong class="col-xs-3 text-center">Mag Hdg</strong>
							<strong class="col-xs-3 text-center" >Slip/<wbr>Skid</strong>
							<strong class="col-xs-3 text-center">Turn Rate</strong>
							<strong class="col-xs-3 text-center">G Load</strong>
						</div>
						<div class="row">
							<span class="col-xs-3 text-center"><span ng-bind="ahrs_heading_mag"></span>&deg;</span>
							<span class="col-xs-3 text-center"><span ng-bind="ahrs_slip_skid"></span>&deg;</span>
							<span class="col-xs-3 text-center"><span ng-bind="ahrs_turn_rate"></span> min</span>
							<span class="col-xs-3 text-center"><span ng-bind="ahrs_gload"></span>G</span>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
	<div class="col-sm-6 hider">
		<div class="panel panel-default">
			<div class="panel-heading">
				<span class="panel_label">GPS</span>
			</div>
			<div class="panel-body">
				<div class="row">
					<span class="col-xs-12">
						<div class="map-container">
        					<div id="map_display" class="world-map" ng-attr-style="background-position:{{map_pos_x + 'px ' + map_pos_y + 'px'}}; width:{{map_width}}px; height:{{map_height}}px; opacity:{{map_opacity}};">
    							<div class="mark-position" ng-style="{left: map_mark_x+'px', top: map_mark_y+'px', opacity: map_mark_opacity}">
									<span class="fa fa-crosshairs"></span>
								</div>
							</div>
						</div>
					</span>
				</div>
	    		<div class="separator"></div>
    			<div class="row">
        			<strong class="col-xs-6 text-center">Location:</strong>
        			<strong class="col-xs-6 text-center">Track:</strong>
    			</div>
				<div class="row">
					<span class="col-xs-6 text-center"><span ng-bind="gps_lat"></span>, <span ng-bind="gps_lon"></span> &plusmn; <span ng-bind="gps_horizontal_accuracy"></span> m <br>
						<b>Altitude MSL:</b> <br>
						<span ng-bind="gps_alt"></span> &plusmn; <span ng-bind="gps_vertical_accuracy"></span> ft  @ <span ng-bind="gps_vert_speed"></span> ft/min <br>
						<b>Height WGS-84 ellipsoid:</b> <br>
						<span ng-bind="gps_height_above_ellipsoid"></span> ft
					</span>
					<span class="col-xs-6 text-center"><span ng-bind="gps_track"></span>&deg; @ <span ng-bind="gps_speed"></span> KTS</span>
				</div>
			</div>
		</div>
	</div>
</div>
<div class="col-sm-12">
	<div class="col-sm-6 hider">
		<div class="panel panel-default">
			<div class="panel-heading">
				<span class="panel_label">Satellites</span>
			</div>
			<div class="panel-body towers-page">
				<div class="row">
					<span class="col-xs-3"><strong>Satellite</strong></span>
					<!--<span class="col-xs-2 text-right"><strong>NMEA Code</strong></span>-->
					<span class="col-xs-3 text-right"><strong>Elevation</strong></span>
					<span class="col-xs-3 text-right"><strong>Azimuth</strong></span>
					<span class="col-xs-3 text-right"><strong>Signal</strong></span>
				</div>

				<div class="row" ng-repeat="satellite in data_list | orderBy: 'SatelliteNMEA'">
					<div class="separator"></div>
					<span class="col-xs-3"><span ng-bind="satellite.SatelliteID"></span><span ng-show="satellite.InSolution">&nbsp;&#x2705;</span></span>
					<!--<span class="col-xs-2 text-right" ng-bind="satellite.SatelliteNMEA"></span>-->
					<span class="col-xs-3 text-right"><span ng-bind="satellite.Elevation < -5 ? '---' : satellite.Elevation"></span>&deg;</span>
					<span class="col-xs-3 text-right"><span ng-bind="satellite.Azimuth < 0 ? '---' : satellite.Azimuth"></span>&deg;</span>
					<span class="col-xs-3 text-right"><span ng-bind="satellite.Signal < 1 ? '---' : satellite.Signal"></span><span style="font-size:50%">&nbsp;dB-Hz</span></span>
				</div>
			</div>

			<div class="separator"></div>
			<div class="panel-footer">
				<div class="row">
					<label class="col-xs-6">GPS solution:</label>
					<span class="col-xs-6"><span ng-bind="SolutionText"></span> @ <span ng-bind="GPS_PositionSampleRate"></span> Hz</span>
				</div>
				<div class="row">
					<label class="col-xs-6">Summary:</label>
					<span class="col-xs-6"><span ng-bind="Satellites"></span> in solution; <span ng-bind="GPS_satellites_seen"></span> seen; <span ng-bind="GPS_satellites_tracked"></span> tracked</span>
				</div>
			</div>
		</div>
	</div>
	<div class="col-sm-6 hider">
		<div class="panel panel-default">
			<div class="panel-heading">
				<span class="panel_label">G-Meter</span>
			</div>
			<div class="panel-body">
				<div class="row">
					<span class="col-xs-12">
						<div id="gMeter_display"></div>
					</span>
				</div>
			</div>
		</div>
	</div>
</div>
